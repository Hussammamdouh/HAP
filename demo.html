<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Park Central DRJ — Pre-Construction Control Board</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Inter:wght@300;400;500;600;700&display=swap');
:root{
  /* deep ink navy with champagne gold accent — boardroom palette */
  --field:#0a1626; --field2:#0d1c30; --panel:#101f33; --panel2:#142740;
  --line:rgba(213,196,161,.14); --line2:rgba(213,196,161,.26);
  --hair:rgba(255,255,255,.06);
  --ink:#f3eee3; --ink2:#c4ceda; --mut:#8597a9;
  --gold:#cBB079; --gold2:#e6d3a3; --gold-dim:#8a7647;
  --r:#e0685f; --r-bg:rgba(224,104,95,.12);
  --a:#d9a64e; --a-bg:rgba(217,166,78,.13);
  --g:#7fb893; --g-bg:rgba(127,184,147,.12);
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Inter',-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 700px at 80% -10%, rgba(203,176,121,.07), transparent 60%),
    radial-gradient(900px 600px at -10% 110%, rgba(203,176,121,.05), transparent 60%),
    var(--field);
  color:var(--ink);
  font-family:var(--sans);
  overflow:hidden;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
  letter-spacing:.01em;
}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
#stage{position:fixed;inset:0;display:flex;flex-direction:column}

/* ---------- top bar ---------- */
.topbar{
  flex:0 0 auto;height:9.4vh;min-height:66px;
  display:flex;align-items:center;gap:1.4vw;
  padding:0 2.6vw;
  background:linear-gradient(180deg,rgba(255,255,255,.02),transparent);
  border-bottom:1px solid var(--line);
  position:relative;
}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);opacity:.5}
.brand{display:flex;align-items:center;gap:1.2vw}
.brand img{height:5.2vh;min-height:34px;width:auto;display:block;opacity:.96}
.brand .div{width:1px;height:4.6vh;background:var(--line2)}
.brand .eyebrow{font-size:clamp(10px,1.0vw,14px);letter-spacing:.34em;color:var(--gold2);font-weight:600;text-transform:uppercase}
.brand .eyebrow b{display:block;color:var(--ink2);letter-spacing:.2em;font-weight:400;margin-top:3px;font-size:.8em;text-transform:none}
.spacer{flex:1 1 auto}
.clock{text-align:right;line-height:1.2}
.clock .d{font-size:clamp(13px,1.2vw,18px);font-weight:500;color:var(--ink)}
.clock .t{font-size:clamp(10px,.9vw,12px);color:var(--mut);letter-spacing:.08em}
.fresh{font-size:clamp(9px,.85vw,12px);color:var(--mut);text-align:right;line-height:1.3;margin-right:.7vw}
.fresh b{color:var(--gold2);font-weight:600}

/* ---------- slide frame ---------- */
.slidewrap{flex:1 1 auto;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;padding:2.6vh 2.6vw 1.4vh;display:flex;flex-direction:column;
  opacity:0;transform:translateY(12px) scale(.997);pointer-events:none;
  transition:opacity .6s cubic-bezier(.22,.61,.36,1),transform .6s cubic-bezier(.22,.61,.36,1)}
.slide.on{opacity:1;transform:none;pointer-events:auto}
.reduce .slide{transition:none}

.slide-head{display:flex;align-items:baseline;gap:1.3vw;margin-bottom:1.8vh;
  padding-bottom:1.4vh;border-bottom:1px solid var(--hair);position:relative}
.slide-head::after{content:"";position:absolute;left:0;bottom:-1px;width:5.5vw;height:2px;
  background:linear-gradient(90deg,var(--gold),transparent)}
.slide-head .tag{font-size:clamp(10px,.9vw,13px);letter-spacing:.36em;color:var(--gold);font-weight:600;text-transform:uppercase;align-self:center}
.slide-head h1{font-family:var(--serif);font-size:clamp(26px,3.4vw,52px);font-weight:600;letter-spacing:.005em;line-height:.98;color:var(--ink)}
.slide-head .sub{color:var(--mut);font-size:clamp(11px,1.0vw,15px);font-weight:300;letter-spacing:.04em}
.slide-head .pagebadge{font-family:var(--sans);font-size:clamp(10px,.9vw,13px);font-weight:600;color:var(--gold2);
  background:rgba(203,176,121,.1);border:1px solid var(--line2);padding:.4vh 1vw;border-radius:999px;align-self:center;letter-spacing:.06em}

/* ---------- KPI strip ---------- */
.kpis{display:grid;gap:1.1vw;margin-bottom:1.9vh}
.kpis.p{grid-template-columns:auto repeat(4,1fr)}
.kpis.s{grid-template-columns:repeat(5,1fr)}
.kpi{background:linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid var(--line);border-radius:4px;padding:1.7vh 1.3vw;
  display:flex;flex-direction:column;justify-content:center;min-height:9.6vh;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--gold-dim);opacity:.7}
.kpi .lab{font-size:clamp(9px,.82vw,12px);letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin-bottom:.7vh;font-weight:500}
.kpi .val{font-family:var(--serif);font-size:clamp(26px,3.0vw,48px);font-weight:600;line-height:.95;color:var(--ink)}
.kpi .val small{font-family:var(--sans);font-size:.36em;font-weight:500;color:var(--ink2);margin-left:.3em;letter-spacing:.02em}
.kpi.alarm::before{background:var(--r)} .kpi.alarm .val{color:var(--r)}
.kpi.ok::before{background:var(--g)} .kpi.ok .val{color:var(--g)}
.kpi .foot{font-size:clamp(9px,.8vw,12px);color:var(--mut);margin-top:.6vh;font-weight:300;letter-spacing:.03em}
.kpi .foot b{color:var(--ink2);font-weight:600}
.kpi .foot .late{color:var(--r)} .kpi .foot .early{color:var(--g)}

/* donut */
.donut{flex:0 0 auto;display:flex;align-items:center;gap:1.2vw;
  background:linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid var(--line);border-radius:4px;padding:1.4vh 1.6vw;min-width:13.5vw;position:relative;overflow:hidden}
.donut::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--gold);opacity:.8}
.ring{position:relative;--p:0;width:9.0vh;height:9.0vh;min-width:58px;min-height:58px;border-radius:50%;
  background:conic-gradient(var(--gold) calc(var(--p)*1%), rgba(255,255,255,.07) 0);
  display:grid;place-items:center;flex:0 0 auto}
.ring::before{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:6.8vh;height:6.8vh;min-width:42px;min-height:42px;border-radius:50%;background:var(--panel2)}
.ring span{position:relative;font-family:var(--serif);font-size:clamp(16px,1.9vw,28px);font-weight:600;color:var(--gold2)}
.donut .meta .lab{font-size:clamp(9px,.82vw,12px);letter-spacing:.2em;text-transform:uppercase;color:var(--mut);font-weight:500}
.donut .meta .big{font-family:var(--serif);font-size:clamp(18px,1.9vw,28px);font-weight:600;margin-top:.4vh;color:var(--ink)}

/* ---------- worklist (the board) ---------- */
.board{flex:1 1 auto;background:linear-gradient(180deg,var(--panel),rgba(16,31,51,.6));
  border:1px solid var(--line);border-radius:5px;display:flex;flex-direction:column;overflow:hidden}
.board .bh{display:flex;align-items:center;justify-content:space-between;padding:1.5vh 1.6vw;border-bottom:1px solid var(--line)}
.board .bh .t{font-family:var(--serif);font-size:clamp(15px,1.5vw,23px);font-weight:600;letter-spacing:.01em;color:var(--ink)}
.board .bh .t span{font-family:var(--sans);color:var(--mut);font-weight:300;margin-left:.8vw;font-size:.62em;letter-spacing:.04em}
.board .bh .legend{display:flex;gap:1.3vw;font-size:clamp(9px,.8vw,12px);color:var(--mut);font-weight:400}
.board .bh .legend i{display:inline-block;width:.62em;height:.62em;border-radius:50%;margin-right:.45em;vertical-align:baseline}
.tablewrap{flex:1 1 auto;overflow:hidden}
table{width:100%;border-collapse:collapse}
thead th{position:sticky;top:0;background:var(--panel2);z-index:2;
  font-size:clamp(9px,.78vw,11px);letter-spacing:.18em;text-transform:uppercase;color:var(--gold2);
  font-weight:600;text-align:left;padding:1.2vh 1.1vw;border-bottom:1px solid var(--line2);white-space:nowrap}
tbody td{padding:1.05vh 1.1vw;border-bottom:1px solid var(--hair);font-size:clamp(11px,1.02vw,15px);vertical-align:middle;font-weight:400}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background .3s}
tbody tr.od{background:var(--r-bg)}
tbody tr.od td:first-child{box-shadow:inset 3px 0 0 var(--r)}
td.idx{color:var(--mut);font-size:.8em;width:2.4vw;text-align:right;font-weight:300}
td.stage{font-weight:500;max-width:0;width:30%;color:var(--ink)}
td.stage .ph{display:block;color:var(--gold);font-weight:500;font-size:.74em;margin-top:.35vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.05em;text-transform:uppercase}
td.scope{color:var(--ink2);white-space:nowrap;font-weight:300;max-width:14vw;overflow:hidden;text-overflow:ellipsis}
td.owner{font-weight:500;white-space:nowrap;color:var(--ink)}
td.cons{color:var(--ink2);white-space:nowrap;font-weight:300}
td.date{color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:400}
td.status .st{font-size:.76em;letter-spacing:.08em;color:var(--ink2);text-transform:uppercase;font-weight:500}
td.days{text-align:right;white-space:nowrap}
.pill{display:inline-block;min-width:6.2vw;text-align:center;padding:.55vh .9vw;border-radius:3px;
  font-weight:600;font-size:.9em;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.pill.r{color:var(--r);background:var(--r-bg);box-shadow:inset 0 0 0 1px rgba(224,104,95,.32)}
.pill.a{color:var(--a);background:var(--a-bg);box-shadow:inset 0 0 0 1px rgba(217,166,78,.32)}
.pill.g{color:var(--g);background:var(--g-bg);box-shadow:inset 0 0 0 1px rgba(127,184,147,.3)}
.empty{padding:6vh 2vw;text-align:center;color:var(--mut);font-size:clamp(13px,1.2vw,18px);font-family:var(--serif);font-style:italic}

/* ---------- summary by-phase table ---------- */
.sumtable{flex:1 1 auto;background:linear-gradient(180deg,var(--panel),rgba(16,31,51,.6));border:1px solid var(--line);border-radius:5px;overflow:hidden;display:flex;flex-direction:column}
.sumtable .bh{padding:1.5vh 1.6vw;border-bottom:1px solid var(--line);font-family:var(--serif);font-size:clamp(15px,1.5vw,23px);font-weight:600;color:var(--ink);letter-spacing:.01em}
.sumtable table td{font-size:clamp(12px,1.1vw,16px);padding:1.55vh 1.1vw}
.proj{display:flex;align-items:center;gap:.8vw;font-weight:500;font-size:clamp(13px,1.2vw,18px);color:var(--ink)}
.dot{width:.8em;height:.8em;border-radius:50%;flex:0 0 auto}
.dot.r{background:var(--r)}.dot.a{background:var(--a)}.dot.g{background:var(--g)}
.bar{position:relative;height:1.5vh;min-height:9px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden;min-width:9vw}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,var(--gold-dim),var(--gold2))}
.bar b{position:absolute;right:.6vw;top:50%;transform:translateY(-50%);font-size:.72em;font-weight:600;color:var(--field)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
td.over b{color:var(--r)}
.var .late{color:var(--r);font-weight:600}.var .early{color:var(--g);font-weight:600}.var .on{color:var(--ink2)}
.portfolio-row td{background:var(--panel2);font-weight:600;border-top:1px solid var(--line2)}
.portfolio-row .proj{font-family:var(--serif)}

/* ---------- footer / controls ---------- */
.footer{flex:0 0 auto;height:5.8vh;min-height:44px;display:flex;align-items:center;gap:1.3vw;
  padding:0 2.6vw;border-top:1px solid var(--line);background:linear-gradient(0deg,rgba(255,255,255,.02),transparent)}
.cycle{flex:1 1 auto;height:2px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.cycle i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-dim),var(--gold2));border-radius:999px}
.dots{display:flex;gap:.8vw}
.dots button{all:unset;cursor:pointer;width:.7vw;height:.7vw;min-width:8px;min-height:8px;border-radius:50%;
  background:rgba(213,196,161,.25);transition:background .3s,transform .3s}
.dots button.on{background:var(--gold);transform:scale(1.3)}
.dots button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.ctrl{display:flex;align-items:center;gap:.55vw}
.ctrl button{all:unset;cursor:pointer;width:3.3vh;height:3.3vh;min-width:27px;min-height:27px;border-radius:4px;
  display:grid;place-items:center;color:var(--ink2);background:rgba(255,255,255,.05);transition:background .25s,color .25s}
.ctrl button:hover{background:rgba(203,176,121,.14);color:var(--gold2)}
.ctrl button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ctrl svg{width:1.5vh;height:1.5vh;min-width:13px;min-height:13px;fill:currentColor}
.pgname{font-size:clamp(10px,.9vw,13px);color:var(--mut);letter-spacing:.06em;min-width:8vw;font-weight:300}
.pgname b{color:var(--gold2);font-weight:600}
@media (max-width:760px){
  .kpis.p,.kpis.s{grid-template-columns:repeat(2,1fr)}
  .donut{grid-column:1 / -1}
  td.cons,td.scope,thead th.cons,thead th.scope{display:none}
}
</style>
</head>

  <div class="topbar">
    <div class="brand">
      <img id="logo" alt="Hassan Allam Properties"/>
      <div class="div"></div>
      <div class="eyebrow">Park Central DRJ<b>Pre-Construction Control Board · Mostakbel City</b></div>

  <div class="footer">
    <div class="ctrl">

    </div>
    <div class="pgname" id="pgname"></div>
    <div class="cycle"><i id="cyclebar"></i></div>
    <div class="dots" id="dots"></div>
  </div>
</div>

/* ---------------- LIVE DATA SOURCE ----------------
   Point DATA_URL at the published JSON (e.g. SharePoint/OneDrive share link
   that returns the raw file, or any public URL). The board fetches it on load
   and every REFRESH_MS. If the fetch fails, it falls back to the data embedded
   in this file so the screen never goes blank.
   To override without editing the file, append ?src=<url> to the page URL.    */
const DATA_URL = "drj_data.json"; // looks for the data file sitting next to this page
const REFRESH_MS = 300000;        // re-pull every 5 minutes
let lastSync = null;

function normalize(json){
  // Accept either {data:{DRJ:[...]}} or {DRJ:[...]} or [...] shapes
  if(Array.isArray(json)) return {DRJ:json};
  if(json && json.data) return json.data;
  return json;
}
async function loadLive(){
  const params=new URLSearchParams(location.search);
  const url = params.get('src') || DATA_URL;
  if(!url) return false;                       // no live source set -> keep fallback
  try{
    const res = await fetch(url, {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const json = await res.json();
    const data = normalize(json);
    if(data && data.DRJ && data.DRJ.length){
      RAW = data;
      lastSync = new Date();
      if(typeof render==='function'){ render(); show(idx); syncName(); }
      const f=document.getElementById('fresh');
      if(f) f.innerHTML='Live · synced<br><b>'+lastSync.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+'</b>';
      return true;
    }
  }catch(e){
    console.warn('Live data fetch failed, using embedded fallback:', e.message);
    const f=document.getElementById('fresh');
    if(f) f.innerHTML='Offline · embedded data<br><b>'+BUILD+'</b>';
  }
  return false;
}


const MS=86400000;
const PROJECTS=[{"key": "DRJ", "name": "Park Central DRJ"}];
function today(){const d=new Date();d.setHours(0,0,0,0);return d;}
function pd(s){if(!s)return null;const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c);}
function dleft(s){const d=pd(s);if(!d)return null;return Math.round((d-today())/MS);}
function overdue(r){const d=pd(r.fFinish);return r.status!=='Complete'&&d&&d<today();}
function isOpen(r){return r.status==='In Progress'||overdue(r);}
function rag(r){const d=pd(r.fFinish);if(!d)return'a';const n=dleft(r.fFinish);if(n<0)return'r';if(n<=21)return'a';return'g';}
function daysLabel(s){const n=dleft(s);if(n===null)return'—';if(n<0)return Math.abs(n)+'d late';if(n===0)return'due today';return n+'d left';}
function maxd(arr){let m=null;for(const s of arr){const d=pd(s);if(d&&(!m||d>m))m=d;}return m;}
function fmtd(d){return d?d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—';}
function esc(s){return(s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function kpis(rows){
  const total=rows.length;
  const complete=rows.filter(r=>r.status==='Complete').length;
  const inprog=rows.filter(r=>r.status==='In Progress').length;
  const notst=rows.filter(r=>r.status==='Not Started').length;
  const over=rows.filter(overdue).length;
  const bEnd=maxd(rows.map(r=>r.bFinish)), fEnd=maxd(rows.map(r=>r.fFinish));
  const vard=(bEnd&&fEnd)?Math.round((fEnd-bEnd)/MS):null;
  return {total,complete,inprog,notst,over,pct:total?complete/total:0,bEnd,fEnd,vard};
}
function projRag(k){return k.over>0?'r':(k.vard&&k.vard>0?'a':'g');}
function varHtml(v){if(v==null)return'<span class="on">—</span>';if(v>0)return'<span class="late">+'+v+'d</span>';if(v<0)return'<span class="early">'+v+'d</span>';return'<span class="on">on plan</span>';}

function worklist(rows){
  return rows.filter(isOpen).sort((a,b)=>{
    const na=dleft(a.fFinish),nb=dleft(b.fFinish);
    if(na===null)return 1; if(nb===null)return -1;
    return na-nb;
  });
}

/* ---- project page (paginated, never scrolls) ---- */
function chunk(a,n){const o=[];for(let i=0;i<a.length;i+=n)o.push(a.slice(i,i+n));return o;}

function projectPage(p,k,rowsChunk,pageIdx,pageCount,startNo,totalOpen){
  const pctTxt=Math.round(k.pct*100);
  let body=rowsChunk.map((r,i)=>{
    const g=rag(r); const od=overdue(r)?' od':''; const n=startNo+i+1;
    return `<tr class="${od.trim()}">
      <td class="idx tnum">${n}</td>
      <td class="stage">${esc(r.stage)}<span class="ph">${esc(r.phase)}</span></td>
      <td class="scope">${esc(r.trade)}</td>
      <td class="owner">${esc(r.owner||'—')}</td>
      <td class="cons">${esc(r.consultant||'—')}</td>
      <td class="status"><span class="st">${esc(r.status)}</span></td>
      <td class="date">${fmtd(pd(r.fFinish))}</td>
      <td class="days"><span class="pill ${g}">${daysLabel(r.fFinish)}</span></td>
    </tr>`;
  }).join('');
  if(!rowsChunk.length) body=`<tr><td colspan="8"><div class="empty">No ongoing or overdue stages — all open work is clear.</div></td></tr>`;
  const fromN=startNo+1, toN=startNo+rowsChunk.length;
  const pageBadge = pageCount>1 ? `<span class="pagebadge">${pageIdx+1} / ${pageCount}</span>` : '';
  const headSpan = totalOpen
    ? (pageCount>1 ? `${totalOpen} open · showing ${fromN}–${toN}` : `${totalOpen} open · most overdue first`)
    : `all open work clear`;
  return `<section class="slide" data-k="${p.key}" data-page="${pageIdx+1}">
    <div class="slide-head">
      <div class="tag">Project</div>
      <h1>${esc(p.name)}</h1>${pageBadge}
      <div class="sub">Design programme · ${k.total} stages</div>
    </div>
    <div class="kpis p">
      <div class="donut">
        <div class="ring" style="--p:${pctTxt}"><span>${pctTxt}%</span></div>
        <div class="meta"><div class="lab">Complete</div><div class="big tnum">${k.complete}<small style="font-size:.6em;color:var(--mut)"> / ${k.total}</small></div></div>
      </div>
      <div class="kpi"><div class="lab">In Progress</div><div class="val tnum">${k.inprog}</div><div class="foot">active stages</div></div>
      <div class="kpi ${k.over>0?'alarm':'ok'}"><div class="lab">Overdue</div><div class="val tnum">${k.over}</div><div class="foot">past forecast finish</div></div>
      <div class="kpi"><div class="lab">Not Started</div><div class="val tnum">${k.notst}</div><div class="foot">remaining stages</div></div>
      <div class="kpi"><div class="lab">Forecast End</div><div class="val" style="font-size:clamp(15px,1.7vw,26px)">${fmtd(k.fEnd)}</div><div class="foot">vs baseline ${varHtml(k.vard)}</div></div>
    </div>
    <div class="board">
      <div class="bh">
        <div class="t">Ongoing &amp; overdue stages<span>${headSpan}</span></div>
        <div class="legend"><span><i style="background:var(--r)"></i>Late</span><span><i style="background:var(--a)"></i>Due ≤21d</span><span><i style="background:var(--g)"></i>On track</span></div>
      </div>
      <div class="tablewrap">
        <table>
          <thead><tr>
            <th class="idx"></th><th>Stage</th><th class="scope">Trade</th><th>Task Owner</th>
            <th class="cons">Consultant</th><th>Status</th><th>Forecast Finish</th><th style="text-align:right">Days</th>
          </tr></thead>
          <tbody>${body}</tbody>
        </table>
      </div>
    </div>
  </section>`;
}

/* ---- summary slide ---- */
function summarySlide(){
  const rows=RAW[PROJECTS[0].key]||[];
  const tot=kpis(rows);
  const pctTxt=Math.round(tot.pct*100);
  // group by phase, preserving first-seen order
  const order=[]; const groups={};
  rows.forEach(r=>{const ph=r.phase||'—'; if(!groups[ph]){groups[ph]=[];order.push(ph);} groups[ph].push(r);});

  const rowsHtml=order.map(ph=>{
    const k=kpis(groups[ph]);
    const pc=Math.round(k.pct*100); const rg=projRag(k);
    return `<tr>
      <td><div class="proj"><span class="dot ${rg}"></span>${esc(ph)}</div></td>
      <td class="num tnum">${k.total}</td>
      <td class="num tnum">${k.complete}</td>
      <td class="num tnum">${k.inprog}</td>
      <td class="num tnum">${k.notst}</td>
      <td class="num over"><b>${k.over}</b></td>
      <td><div class="bar"><i style="width:${pc}%"></i><b>${pc}%</b></div></td>
      <td class="date">${fmtd(k.bEnd)}</td>
      <td class="date">${fmtd(k.fEnd)}</td>
      <td class="var">${varHtml(k.vard)}</td>
    </tr>`;
  }).join('');

  return `<section class="slide" data-k="SUMMARY">
    <div class="slide-head">
      <div class="tag">Programme</div>
      <h1>Park Central DRJ — Summary</h1>
      <div class="sub">Pre-construction · design &amp; authorities · by phase</div>
    </div>
    <div class="kpis s">
      <div class="kpi"><div class="lab">Total Stages</div><div class="val tnum">${tot.total}</div><div class="foot">across ${order.length} phases</div></div>
      <div class="kpi ok"><div class="lab">Complete</div><div class="val tnum">${tot.complete}</div><div class="foot"><b>${pctTxt}%</b> of programme</div></div>
      <div class="kpi"><div class="lab">In Progress</div><div class="val tnum">${tot.inprog}</div><div class="foot">active now</div></div>
      <div class="kpi ${tot.over>0?'alarm':'ok'}"><div class="lab">Overdue</div><div class="val tnum">${tot.over}</div><div class="foot">need attention</div></div>
      <div class="kpi"><div class="lab">Forecast End</div><div class="val" style="font-size:clamp(15px,1.7vw,26px)">${fmtd(tot.fEnd)}</div><div class="foot">vs baseline ${varHtml(tot.vard)}</div></div>
    </div>
    <div class="sumtable">
      <div class="bh">Phase health</div>
      <table>
        <thead><tr>
          <th>Phase</th><th class="num" style="text-align:right">Total</th><th class="num" style="text-align:right">Done</th>
          <th class="num" style="text-align:right">In Prog</th><th class="num" style="text-align:right">Not Started</th>
          <th class="num" style="text-align:right">Overdue</th><th>% Complete</th><th>Baseline End</th><th>Forecast End</th><th>Variance</th>
        </tr></thead>
        <tbody>
          ${rowsHtml}
          <tr class="portfolio-row">
            <td><div class="proj"><span class="dot ${tot.over>0?'r':'g'}"></span>ALL PHASES</div></td>
            <td class="num tnum">${tot.total}</td><td class="num tnum">${tot.complete}</td>
            <td class="num tnum">${tot.inprog}</td><td class="num tnum">${tot.notst}</td>
            <td class="num over"><b>${tot.over}</b></td>
            <td><div class="bar"><i style="width:${pctTxt}%"></i><b>${pctTxt}%</b></div></td>
            <td class="date">${fmtd(tot.bEnd)}</td><td class="date">${fmtd(tot.fEnd)}</td><td class="var">${varHtml(tot.vard)}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>`;
}

/* ---- build slides (auto-paginated to fit; no scroll) ---- */
const wrap=document.getElementById('slidewrap');
const DEFAULT_PER=14;
function computePerPage(){
  let probe=PROJECTS[0], best=-1;
  PROJECTS.forEach(p=>{const n=worklist(RAW[p.key]||[]).length; if(n>best){best=n;probe=p;}});
  if(!probe) return DEFAULT_PER;
  const rows=RAW[probe.key]||[], k=kpis(rows), wl=worklist(rows);
  if(!wl.length) return DEFAULT_PER;
  const tmp=document.createElement('div');
  tmp.innerHTML=projectPage(probe,k,wl,0,1,0,wl.length);
  const slide=tmp.firstElementChild; slide.classList.add('on'); slide.style.visibility='hidden';
  wrap.appendChild(slide);
  const tw=slide.querySelector('.tablewrap'), thead=slide.querySelector('thead'), row=slide.querySelector('tbody tr');
  let per=DEFAULT_PER;
  if(tw&&row){const avail=tw.clientHeight-(thead?thead.offsetHeight:0), rh=row.offsetHeight;
    if(avail>0&&rh>0) per=Math.max(1,Math.floor(avail/rh));}
  wrap.removeChild(slide);
  return per;
}
let slides=[], idx=0, titles=['Programme summary'];
function render(){
  const per=computePerPage();
  let html=summarySlide(); const t=['Programme summary'];
  PROJECTS.forEach(p=>{
    const rows=RAW[p.key]||[], k=kpis(rows), wl=worklist(rows);
    const pages = wl.length ? chunk(wl,per) : [[]];
    pages.forEach((pg,i)=>{
      html+=projectPage(p,k,pg,i,pages.length,i*per,wl.length);
      t.push(p.name+(pages.length>1?('  ('+(i+1)+'/'+pages.length+')'):''));
    });
  });
  wrap.innerHTML=html; titles=t;
  slides=[...wrap.querySelectorAll('.slide')];
  if(idx>=slides.length) idx=0;
  slides.forEach((s,i)=>s.classList.toggle('on',i===idx));
  buildDots();
}

/* dots */
const dotsEl=document.getElementById('dots');
function buildDots(){
  dotsEl.innerHTML='';
  titles.forEach((t,i)=>{
    const b=document.createElement('button');
    b.setAttribute('aria-label',t); if(i===idx)b.classList.add('on');
    b.onclick=()=>go(i,true); dotsEl.appendChild(b);
  });
}
function syncDots(){[...dotsEl.children].forEach((b,i)=>b.classList.toggle('on',i===idx));}
const pgname=document.getElementById('pgname');
function syncName(){pgname.innerHTML='<b>'+(idx+1)+'</b> / '+titles.length+' · '+esc(titles[idx]);}

/* nav */
function show(i){slides.forEach((s,j)=>s.classList.toggle('on',j===i));}
function go(i,manual){
  idx=(i+slides.length)%slides.length;
  show(idx); syncDots(); syncName(); resetCycle();
}
function next(m){go(idx+1,m)} function prev(m){go(idx-1,m)}

/* cycle bar + autoplay */
const bar=document.getElementById('cyclebar');
let playing=true, t0=performance.now(), raf=null;
function resetCycle(){t0=performance.now();}
function loop(now){
  if(playing){
    let e=(now-t0)/CYCLE_MS;
    if(e>=1){ next(false); e=0; }
    bar.style.width=(Math.min(e,1)*100)+'%';
  }
  raf=requestAnimationFrame(loop);
}
const playBtn=document.getElementById('play');
const playIcon=document.getElementById('playicon');
function setPlay(v){
  playing=v; resetCycle();
  playIcon.innerHTML = v ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
  playBtn.title = v ? 'Pause (space)' : 'Play (space)';
}
document.getElementById('next').onclick=()=>next(true);
document.getElementById('prev').onclick=()=>prev(true);
playBtn.onclick=()=>setPlay(!playing);
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){next(true);e.preventDefault();}
  else if(e.key==='ArrowLeft'){prev(true);e.preventDefault();}
  else if(e.key===' '){setPlay(!playing);e.preventDefault();}
});

/* clock + midnight refresh */
function tick(){
  const n=new Date();
  document.getElementById('clkD').textContent=n.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
  document.getElementById('clkT').textContent='As of '+n.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}
let lastDay=today().getTime();
function watchDay(){
  const d=today().getTime();
  if(d!==lastDay){lastDay=d; render(); show(idx);}   // recompute days/overdue after midnight
}

/* reduced motion */
if(matchMedia('(prefers-reduced-motion: reduce)').matches){document.body.classList.add('reduce');}

render(); syncName(); tick(); setPlay(true);
loadLive();
setInterval(loadLive, REFRESH_MS);
raf=requestAnimationFrame(loop);
setInterval(tick,1000*30);
setInterval(watchDay,1000*60);
let _rz; addEventListener('resize',()=>{clearTimeout(_rz);_rz=setTimeout(()=>{render();syncName();},250);});

const RELOAD_MS=1800000;
document.getElementById('fresh').innerHTML = BUILD ? ('DRJ Time Frame<br><b>'+BUILD+'</b>') : '';
if(RELOAD_MS>0){ setTimeout(()=>location.reload(), RELOAD_MS); }
</script>
</body>
